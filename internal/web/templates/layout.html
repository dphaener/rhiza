{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Rhiza</title>
<link rel="icon" href="/static/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D0C09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2EEE4" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/static/css/rhiza-tokens.css">
<link rel="stylesheet" href="/static/css/rhiza.css">
</head>
<body class="rz"{{if .Base}} data-rz-base="{{.Base}}"{{end}}>
<div class="rz-app">
<header class="rz-header">
  <a class="rz-wordmark" href="/"><b>Rhiza</b><span>monitor</span></a>
{{if or .Base .Root}}<button type="button" class="rz-picker-btn" data-rz-picker="/picker" aria-haspopup="dialog" aria-expanded="false"><span class="rz-picker-cur">{{if .Project}}{{.Project}}{{else}}All projects{{end}}</span>{{if .NeedsYou}}<span class="rz-count is-due" aria-label="{{.NeedsYou}} need you">{{.NeedsYou}}</span>{{end}}<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>{{end}}
  <nav class="rz-nav" aria-label="Pages"><a href="/"{{if eq .Nav "overview"}} aria-current="page"{{end}}>Home</a><a href="/runs"{{if eq .Nav "runs"}} aria-current="page"{{end}}>Runs</a><a href="/roadmap"{{if eq .Nav "roadmap"}} aria-current="page"{{end}}>Roadmap</a></nav>
  <div class="rz-header-end">{{if .Daemon.Text}}{{template "pill" .Daemon}}{{end}}<span class="rz-live" title="Live stream connected"><span class="rz-live-dot" aria-hidden="true"></span>live</span></div>
</header>
<main class="rz-main">
{{template "stale"}}
{{template "content" .}}
</main>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>{{end}}
