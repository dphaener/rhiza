<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs · Rhiza</title>
<link rel="icon" href="/static/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D0C09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2EEE4" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/static/css/rhiza-tokens.css">
<link rel="stylesheet" href="/static/css/rhiza.css">
</head>
<body class="rz">
<div class="rz-app">
<header class="rz-header">
  <a class="rz-wordmark" href="/"><b>Rhiza</b><span>monitor</span></a>
  <nav class="rz-nav" aria-label="Pages"><a href="/">Overview</a><a href="/runs" aria-current="page">Runs</a><a href="/roadmap">Roadmap</a></nav>
  <div class="rz-header-end"><span class="rz-live" title="Live stream connected"><span class="rz-live-dot" aria-hidden="true"></span>live</span></div>
</header>
<main class="rz-main">
<div class="rz-stale" id="rz-stale" role="status" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6 13 12.2H1Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 5.6v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="10.3" r=".8" fill="currentColor"/></svg><span><b>Live stream dropped.</b> Showing what was true <span id="rz-stale-since">a moment ago</span>.</span><span class="rz-meta">retrying</span></div>
<div class="rz-pagehead"><div><p class="rz-kicker">Overview</p><h1>Runs</h1></div></div>
<div class="rz-grid rz-grid--2">
  <div class="rz-stack"><div class="rz-section" data-rz-fragment="/fragments/daemon" data-rz-events="daemon inbox change"><section class="rz-panel">
  <div class="rz-panel-head"><div><p class="rz-kicker">Daemon</p><h2>Not running</h2></div></div>
  <div class="rz-daemon">
    <div class="rz-stat"><p class="rz-kicker">State</p><div class="rz-stat-val">Not running</div></div>
    <div class="rz-stat"><p class="rz-kicker">Run slots</p><div class="rz-stat-val">0<small>/ 0</small></div><div class="rz-slots" aria-hidden="true"></div></div>
  </div>
  <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <p class="rz-kicker" style="margin-right:4px">Health</p>
    <span class="rz-health"></span>
  </div>
</section></div><div class="rz-section" data-rz-fragment="/fragments/runs" data-rz-events="run daemon"><section class="rz-panel rz-panel--flush">
  <div class="rz-panel-head"><div><p class="rz-kicker">Live runs</p><h2>No live runs</h2></div><a class="rz-aside" style="color:var(--teal)" href="/runs">All runs →</a></div>
  <div class="rz-empty"><p class="rz-empty-title">No live runs</p><p>Runs that are going or waiting show here.</p></div>
</section></div></div>
</div>
</main>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
