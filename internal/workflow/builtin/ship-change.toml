name = "ship-change"

# Ship a change set with a conductor: one agent session plans the leaves
# when there are none, builds and verifies each, runs the plan, code and
# qa checks, and lands the change set on the branch. The daemon owns the
# rest: the gate (build-check, review-check, rhiza check and the local
# gate), the owner's sign-off, the push and the PR, CI at that head, the
# merge of the tested head, main's CI, close-out, the ship command and the
# deploy check.
#
# Every red result up to and including the merge hands back to conduct
# (handback:conduct), at most handback_cap times, then the run parks
# stopped with an inbox item. The steps after the merge have no on.fail
# route and no hand-back: nothing on the branch can fix a merged change
# set, so a red main CI, a failed close-out, ship or deploy-check stops
# the run.
handback_cap = 3

[step.conduct]
kind = "agent"
prompt = """/rhiza-conduct Conduct change set {change} in run {run}: follow rhiza guide conduct.

When the hand-back is rhiza ship merge's main-moved output (origin/main moved past the tested head), bring main into the branch with rhiza ship rebase --no-push: it merges origin/main, settles rendered-only conflicts by rendering again, and pushes nothing. Never run plain rhiza ship rebase. If it leaves a code conflict in progress, have the conflict fixer resolve and commit it (never by hand), then finish: the gate, sign-off, push and a second CI wait on the new head follow."""
handback = """The run handed change set {change} back to you in run {run}: read {handback} for what failed and why, fix it the way rhiza guide conduct says (spawn the role, never fix it yourself), land and render again on the branch, then finish with rhiza session done."""
until = "true"
until_when = "done"
on.pass = "gate"

[[step.conduct.check]]
name = "plan"

[[step.conduct.check]]
name = "code"

[[step.conduct.check]]
name = "qa"

# build-check fails unless every leaf has live Evidence by a verifier who
# wrote none of its commits; review-check fails on any open blocker or major
# finding of a declared check; ship gate is the local gate while CI is
# unstable (the pre-push check runs inside the push step's ship open-pr).
[step.gate]
kind = "gate"
commands = [
  "rhiza run build-check",
  "rhiza run review-check",
  "rhiza check",
  "rhiza ship gate",
]
stall = "70m"
on.pass = "signoff"
on.fail = "handback:conduct"

[step.signoff]
kind = "signoff"
on.pass = "push"
on.changes = "handback:conduct"

[step.push]
kind = "command"
run = "rhiza ship open-pr"
on.pass = "wait-ci"
on.fail = "handback:conduct"

# Waits for CI at the pushed head to settle, green or red, so a red CI
# ends the wait as soon as it finishes rather than at the timeout. A PR
# GitHub reports conflicting has no CI: --settled merges main into the
# branch as ship rebase does, and a conflict in code it leaves in progress
# settles the wait. A timeout hands back.
[step.wait-ci]
kind = "wait"
until = "rhiza ship check --settled"
timeout = "2h"
interval = "30s"
max_interval = "2m"
on.pass = "merge"
on.timeout = "handback:conduct"

# Only pass and fail. Ship check first: it passes only when every check is
# green and records the head the merge tests against, so a settled red CI
# (or a code conflict left in progress) fails here and hands back to
# conduct with its output. A draft or a merge GitHub refused stops the run
# (the stop exit); main having moved past the tested head, or a gh, fetch
# or git error, hands back to conduct with ship merge's output.
[step.merge]
kind = "command"
run = "rhiza ship check && rhiza ship merge"
on.pass = "main-ci"
on.fail = "handback:conduct"

# Main's CI is one step. When the merge commit's tree equals the tested
# head's, the check passes at its first run; when main moved between the
# check and the merge it dispatches CI on the merge commit and the wait
# polls until that settles. A red main stops the run (the stop exit says
# CI failed on main after this change set's merge), and so does a timeout.
[step.main-ci]
kind = "wait"
until = "rhiza ship check --main"
timeout = "1h"
interval = "30s"
max_interval = "2m"
on.pass = "close-out"

[step.close-out]
kind = "command"
run = "rhiza ship close-out"
on.pass = "ship"

[step.ship]
kind = "command"
run = "rhiza ship command"
on.pass = "deploy-check"

# After the ship command: polls the repo's deploy health URL (daemon
# setting rhiza.ship.deployUrl) until it answers 200 or rhiza.ship.deployTimeout
# passes. With no URL set the step passes at once.
[step.deploy-check]
kind = "command"
run = "rhiza ship deploy"
