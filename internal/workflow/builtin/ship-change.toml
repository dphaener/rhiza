name = "ship-change"

# Ship a change set through Rhiza's own build and review: the build
# workflow's leaves, the review workflow's checks with its sign-off
# skipped, the pull request opened with the review's summary, CI, and then
# the owner's sign-off here. rhiza run request-changes goes back into
# review's checks step (review/review); ship open-pr then pushes and
# replaces the PR body, and the run waits for CI and signs off again.
[step.build]
kind = "workflow"
workflow = "build"
on.pass = "review"

[step.review]
kind = "workflow"
workflow = "review"
skip = ["signoff"]
on.pass = "open-pr"

[step.open-pr]
kind = "command"
run = "rhiza ship open-pr"
max_visits = 3
on.pass = "wait-pr"

[step.wait-pr]
kind = "wait"
until = "rhiza ship check --settled"
timeout = "2h"
interval = "30s"
max_visits = 3
on.pass = "pr-green"

[step.pr-green]
kind = "command"
run = "rhiza ship check"
max_visits = 3
on.pass = "signoff"

[step.signoff]
kind = "signoff"
max_visits = 3
on.pass = "rebase"
on.changes = "review/review"

[step.rebase]
kind = "command"
run = "rhiza ship rebase"
on.pass = "wait-rebased"

[step.wait-rebased]
kind = "wait"
until = "rhiza ship check --settled"
timeout = "2h"
interval = "30s"
on.pass = "rebased-green"

[step.rebased-green]
kind = "command"
run = "rhiza ship check"
on.pass = "land"

[step.land]
kind = "command"
run = "rhiza ship land"
on.pass = "wait-landed"

[step.wait-landed]
kind = "wait"
until = "rhiza ship check --settled"
timeout = "2h"
interval = "30s"
on.pass = "landed-green"

[step.landed-green]
kind = "command"
run = "rhiza ship check"
on.pass = "rebase-merge"

[step.rebase-merge]
kind = "command"
run = "rhiza ship rebase"
on.pass = "wait-rebased-merge"

[step.wait-rebased-merge]
kind = "wait"
until = "rhiza ship check --settled"
timeout = "2h"
interval = "30s"
on.pass = "rebased-merge-green"

[step.rebased-merge-green]
kind = "command"
run = "rhiza ship check"
on.pass = "merge"

[step.merge]
kind = "command"
run = "rhiza ship merge"
on.pass = "wait-main"

[step.wait-main]
kind = "wait"
until = "rhiza ship check --main --settled"
timeout = "1h"
interval = "30s"
on.pass = "main-green"

[step.main-green]
kind = "command"
run = "rhiza ship check --main"
on.pass = "close-out"

[step.close-out]
kind = "command"
run = "rhiza ship close-out"
on.pass = "ship"

[step.ship]
kind = "command"
run = "rhiza ship command"
