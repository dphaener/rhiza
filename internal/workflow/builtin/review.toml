name = "review"

# A review of a built change set. code-check runs rhiza check and
# build-check in the run's worktree. With no on.fail, a failed code check
# ends the run failed at once; a repo override may route it elsewhere.
[step.code]
kind = "command"
run = "rhiza run code-check"
on.pass = "lints"

# lints reads the model lint hits code-check journalled. Hits never fail
# the code check; here a hit sends the run to lint-fix, one attempt, and
# then on to the checks whatever it did, so the model check sees the rest.
[step.lints]
kind = "command"
run = "rhiza run lint-check"
on.pass = "review"
on.fail = "lint-fix"

[step.lint-fix]
kind = "agent"
prompt = "/rhiza-fixer Fix the model lint hits that rhiza run lint-check lists for change set {change} before the checks run: follow rhiza guide fixer."
until = "true"
until_when = "done"
max_visits = 1
on.pass = "review"

# The checks step runs every check at once, each a fresh session in a
# throwaway checkout of the branch head, told only the change set, its
# check and the cycle. A check with a blocker or major gets a critic; what
# the critic confirms goes to a fixer per leaf, one at a time, each
# followed by that leaf's verifier, then to one fixer for findings naming
# no leaf. Only the failed checks re-run, for at most 2 fix cycles; what
# still fails then becomes questions. max_visits lets the owner's
# requests for changes re-enter the step.
[step.review]
kind = "checks"
split = "auto"
max_visits = 3
on.pass = "render"

[[step.review.check]]
name = "compliance"
models = ["opus"]
prompt = "/rhiza-check-compliance Run the compliance check of change set {change} (cycle {cycle}): follow rhiza guide check-compliance."

[[step.review.check]]
name = "quality"
models = ["opus"]
prompt = "/rhiza-check-quality Run the quality check of change set {change} (cycle {cycle}): follow rhiza guide check-quality."

[[step.review.check]]
name = "qa"
models = ["opus"]
prompt = "/rhiza-check-qa Run the qa check of change set {change} (cycle {cycle}): follow rhiza guide check-qa."

[[step.review.check]]
name = "model"
models = ["opus"]
prompt = "/rhiza-check-model Run the model check of change set {change} (cycle {cycle}): follow rhiza guide check-model."

# A critic confirms or drops each blocker and major of its check's latest
# round, and never adds a finding.
[step.review.critic]
models = ["opus"]
prompt = "/rhiza-critic Criticise the latest round of the {check} check of change set {change} (cycle {cycle}): follow rhiza guide critic."

# A fixer is told the confirmed findings (appended to this prompt) and
# fixes them in one new commit: a leaf's with `Leaf: {leaf}`, the change
# set's ({leaf} empty) with `Review: <run>`.
[step.review.fixer]
models = ["opus"]
prompt = "/rhiza-fixer Fix the findings below for change set {change} in review cycle {cycle}: follow rhiza guide fixer."

# A fixed leaf's verifier works in a detached checkout at the fixer's
# commit ($RHIZA_COMMIT) and passes only with Evidence written as itself.
[step.review.verifier]
models = ["opus"]
low_risk_models = ["sonnet"]
risky_paths = [
  "*_test.go", "**/*_test.go", "**/testdata/**", "**/main_test.go",
  ".githooks/**", "**/hooks/**",
  ".github/**",
  ".rhiza/workflows/**", "internal/workflow/builtin/**",
  "**/migrations/**", "**/migrate/**",
  "**/*retry*",
]
prompt = "/rhiza-verifier Verify leaf {leaf} of change set {change} ({title}) at commit $RHIZA_COMMIT: follow rhiza guide verifier."

# Fixers, verifiers and checks write records (actors, Evidence), which
# leaves .rhiza/rendered stale. Render and commit the rendered folder on
# the branch after the last of them, with the .rhiza/log entries they
# left uncommitted, so rhiza check passes on it; nothing to render
# commits nothing. The project's generate command (rhiza.ship.generate)
# runs first, so the generated files it changes are committed with the
# render; a failing command fails the step. Each request for changes comes back through here.
[step.render]
kind = "command"
run = """
rhiza ship generate &&
rhiza render &&
git add -A -- .rhiza/rendered .rhiza/log &&
{ git diff --cached --quiet ||
  git commit -q -m 'Render after the review' -m "Change: $RHIZA_CHANGE"; }
"""
max_visits = 3
on.pass = "signoff"

# The run waits for the owner: `rhiza run approve` ends it done, and the
# change set stays accepted, as landing is left to the owner or a ship
# run; `rhiza run request-changes` sends named checks back to review.
[step.signoff]
kind = "signoff"
max_visits = 3
on.pass = "done"
on.changes = "review"
