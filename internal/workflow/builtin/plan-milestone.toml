name = "plan-milestone"

# Planning a milestone needs the owner: every stage waits on them. A repo
# changes that by overriding this workflow like any other.
autonomous = false

# The interview plans the change set with the owner, straight into the
# model: the plan is the model, so no step writes or reads a plan file.
[step.interview]
kind = "agent"
prompt = "/rhiza-plan Plan change set {change} ({title}) with the owner, straight into the model, following the rhiza-plan skill (`rhiza guide plan`). Your very last action, once the plan is written, is to run `rhiza session done`: this run moves on to a fresh review only then, never because you sit idle."
until = "true"
until_when = "done"
on.pass = "milestone-check"

# Every change set the plan makes must serve a milestone, directly or
# through an intent under one. With no on.fail, a failure ends the run
# failed with the command's output as the detail, whether or not the
# interview session exited.
[step.milestone-check]
kind = "command"
run = "rhiza run milestone-check"
on.pass = "review"

# Each review round: a fresh reviewer told only the change set's ID, a
# critic who confirms or drops its findings, then review-check. A failed
# check goes to the reviser and back to a fresh review.
[step.review]
kind = "agent"
prompt = "Review the plan of change set {change} as the reviewer: follow `rhiza guide plan-review`, then run `rhiza session done`."
until = "true"
until_when = "done"
max_visits = 3
on.pass = "critic"

[step.critic]
kind = "agent"
prompt = "Judge the latest review round of the plan of change set {change} as the critic: follow `rhiza guide plan-review`, then run `rhiza session done`."
until = "true"
until_when = "done"
max_visits = 3
on.pass = "check"

[step.check]
kind = "command"
run = "rhiza run review-check"
max_visits = 3
on.pass = "gate"
on.fail = "revise"

[step.revise]
kind = "agent"
prompt = "Fix the confirmed findings of the latest review round of the plan of change set {change} as the reviser: follow `rhiza guide plan-review`, then run `rhiza session done`."
until = "true"
until_when = "done"
max_visits = 2
on.pass = "review"

# The gate proposes the plan's draft change sets: the owner accepts them,
# or, in an autonomous run, the gate does once the review passed.
[step.gate]
kind = "command"
run = "rhiza run gate"
on.pass = "open-pr"

# The gate rendered and committed the branch. The plan ends with it on
# origin and its pull request open, its body the plan's summary; a second
# visit pushes and replaces that body.
[step.open-pr]
kind = "command"
run = "rhiza ship open-pr"
max_visits = 3
on.pass = "wait-pr"

# The plan's PR merges once its CI is green, pinned to the checked head.
# Before the merge, as in ship-change, ship rebase brings the branch up to
# origin's main when another change set landed meanwhile, settling the
# rendered files' conflicts by rendering again, and the rebased head waits
# for CI of its own. The merge does not land the change set; close-out removes the branch and
# worktree and forgets the ship state, so a later ship run on the change
# set opens and merges its own PR.
[step.wait-pr]
kind = "wait"
until = "rhiza ship check --reruns 2 --settled"
timeout = "2h"
interval = "30s"
max_visits = 3
on.pass = "pr-green"

[step.pr-green]
kind = "command"
run = "rhiza ship check --reruns 2"
max_visits = 4
on.pass = "rebase"
on.fail = "pr-green-infra"

# A red with no failing test is a CI infra outage: wait for it to clear,
# rerunning the failed jobs with backoff, then check the head again. A red
# with a failing test fails the triage and ends the run. The wait's
# timeout ends the run with the infra failure in its detail.
[step.pr-green-infra]
kind = "command"
run = "rhiza ship check --infra"
max_visits = 4
on.pass = "pr-green-infra-wait"

[step.pr-green-infra-wait]
kind = "wait"
until = "rhiza ship check --settled --changed --rerun-infra"
timeout = "6h"
interval = "30s"
max_visits = 3
on.pass = "pr-green"

[step.rebase]
kind = "command"
run = "rhiza ship rebase"
max_visits = 3
on.pass = "wait-rebased"

[step.wait-rebased]
kind = "wait"
until = "rhiza ship check --reruns 2 --settled"
timeout = "2h"
interval = "30s"
max_visits = 3
on.pass = "rebased-green"

[step.rebased-green]
kind = "command"
run = "rhiza ship check --reruns 2"
max_visits = 4
on.pass = "merge"
on.fail = "rebased-green-infra"

# A red with no failing test is a CI infra outage: wait for it to clear,
# rerunning the failed jobs with backoff, then check the head again. A red
# with a failing test fails the triage and ends the run. The wait's
# timeout ends the run with the infra failure in its detail.
[step.rebased-green-infra]
kind = "command"
run = "rhiza ship check --infra"
max_visits = 4
on.pass = "rebased-green-infra-wait"

[step.rebased-green-infra-wait]
kind = "wait"
until = "rhiza ship check --settled --changed --rerun-infra"
timeout = "6h"
interval = "30s"
max_visits = 3
on.pass = "rebased-green"

# Merges nothing when origin/main moved after the head's checks passed:
# the step fails and the run rebases and waits on the new head again, up
# to 3 times.
[step.merge]
kind = "command"
run = "rhiza ship merge"
max_visits = 3
on.pass = "close-out"
on.fail = "rebase"

[step.close-out]
kind = "command"
run = "rhiza ship close-out --forget"
