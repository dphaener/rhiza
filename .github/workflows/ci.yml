name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # `make check` is the single entry point (gofmt, vet, tests), so local and
    # CI runs cannot drift apart.
    - name: Run checks
      run: make check
