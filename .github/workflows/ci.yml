name: CI

# Pull requests, and a manual dispatch on a given commit: a push to main
# re-runs what the pull request already passed, so Ship dispatches CI on a
# main commit only when its tree differs from the tested head's. A newer push
# to a pull request cancels that pull request's in-progress run; dispatched
# runs are keyed on their sha, so they never cancel each other.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to test
        required: true

run-name: CI ${{ inputs.sha || github.event.pull_request.title }}

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04

    steps:
    # Full history: `rhiza check` compares against origin/main by default,
    # which a shallow pull-request checkout does not have.
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.sha || github.sha }}
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # `make check` is the single entry point (gofmt, vet, tests), so local and
    # CI runs cannot drift apart.
    - name: Run checks
      run: make check
