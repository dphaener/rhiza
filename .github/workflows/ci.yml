name: CI

# Pull requests only: a push to main re-runs what the pull request already
# passed. A newer push to a pull request cancels that pull request's
# in-progress run.
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04

    steps:
    # Full history: `rhiza check` compares against origin/main by default,
    # which a shallow pull-request checkout does not have.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # `make check` is the single entry point (gofmt, vet, tests), so local and
    # CI runs cannot drift apart.
    - name: Run checks
      run: make check
