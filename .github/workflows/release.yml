name: Release

# Only v* tags publish a release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # tools/release cut pushes an annotated tag whose message is the version
    # then the notes; the notes become the release body. checkout may have
    # replaced the annotation with the commit, so fetch the tag object again.
    - name: Take the release notes from the tag annotation
      run: |
        git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
        git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: dist/*.tar.gz

    - name: Publish the channel manifest
      run: |
        go run ./tools/release -dist dist -tag "$GITHUB_REF_NAME" -commit "$GITHUB_SHA" -repo "$GITHUB_REPOSITORY"
        gh release upload "$GITHUB_REF_NAME" dist/manifest.json --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
