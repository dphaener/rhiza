name = "plan-bug"

# A bug request's plan run (.rhiza/dispatch.toml [request] bug): the plan
# workflow, autonomous whatever rhiza.autonomy.* says, so a bug is planned
# with no owner step. The planner records its assumptions as Decisions and
# an arbiter decides any question it raises.
autonomous = true

[env]
GOTMPDIR = "{run_tmp}"

[step.plan]
kind = "workflow"
workflow = "plan"
on.pass = "done"

[[cleanup]]
name = "go-cleanup"
run = "sh .rhiza/workflows/go-cleanup.sh"
