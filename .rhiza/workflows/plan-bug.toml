name = "plan-bug"

# A bug request's plan run (.rhiza/dispatch.toml [request] bug): the plan
# workflow, autonomous whatever rhiza.autonomy.* says, so a bug is planned
# with no owner step. The planner records its assumptions as Decisions and
# an arbiter decides any question it raises.
autonomous = true
#
# Release marks (CLAUDE.md, tools/release): the planner writes a note
# `severe: <reason>` on the change set it plans only when the bug causes data
# loss, a corrupted log or model, or a binary that cannot run, and
# `breaking: <reason>` when the fix changes a CLI, --json, setting or .rhiza
# format users rely on. Reviewers add either mark the plan missed.

[env]
GOTMPDIR = "{run_tmp}"

[step.plan]
kind = "workflow"
workflow = "plan"
on.pass = "done"

[[cleanup]]
name = "go-cleanup"
run = "sh .rhiza/workflows/go-cleanup.sh"
