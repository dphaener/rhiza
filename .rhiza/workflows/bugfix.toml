name = "bugfix"

# A bug's planned change set (.rhiza/dispatch.toml [ready] bug): the built-in
# ship-change (build, review, PR, CI, land, merge), autonomous whatever
# rhiza.autonomy.* says, so the fix ships with no owner sign-off.
autonomous = true

[env]
GOTMPDIR = "{run_tmp}"
SHIP_HEAD_RHIZA = "{run_tmp}/rhiza-head"
# Only this file's [env] applies, not the included ship-change's, so its
# head-build steps (which fail with no command) need SHIP_HEAD_BUILD here.
SHIP_HEAD_BUILD = 'go build -o "$SHIP_HEAD_RHIZA" ./cmd/rhiza'

[step.ship]
kind = "workflow"
workflow = "ship-change"
on.pass = "done"

[[cleanup]]
name = "go-cleanup"
run = "sh .rhiza/workflows/go-cleanup.sh"
